<!doctype html>
<!--
  LaunchFrame composition starter — mechanics only, not a design.
  Copy to working/<platform>/<target>/NN.html, set the canvas size, tokens and fonts from
  design-system.md, then design this shot individually. Delete what you don't use.
  Render: python <skill>/scripts/render_html.py "working/<platform>/<target>/*.html" --outdir <platform>/<target> --size WxH
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Fonts: load the app's own font files (keep them + license in working/fonts/). */
  /* @font-face { font-family: "AppDisplay"; src: url("../../fonts/AppDisplay-Bold.ttf"); font-weight: 700; } */

  :root {
    /* Canvas: must equal the --size passed to render_html.py */
    --w: 1080px;
    --h: 1920px;
    /* Tokens: copy from design-system.md (evidence-based, not defaults) */
    --ground: #FFFFFF;
    --ink: #111111;
    --accent: #000000;
    --font-display: "AppDisplay", system-ui, sans-serif;
    --margin: 80px;
  }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-display); position: relative; }

  .headline {
    position: absolute; left: var(--margin); right: var(--margin); top: 120px;
    margin: 0; font-size: 92px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em;
    text-wrap: balance;
  }

  /* Real screenshot: set ONE of width/height so the aspect ratio is preserved. */
  .shot {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 820px; height: auto; display: block;
    /* border-radius: 44px;   match the device corner if masking */
  }

  /* Intentional crop: a box with object-fit: cover never distorts, it crops. */
  .crop { position: absolute; overflow: hidden; }
  .crop img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; display: block; }
</style>
</head>
<body>
  <h1 class="headline">Headline from the storyboard</h1>
  <img class="shot" src="../../../source-screenshots/home.png" alt="">
</body>
</html>
